<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>CodeWrite</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#eef7fb;
}

/* HEADER */

.header{
  height:60px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid #e1ebef;
}

.profile-btn{
  width:42px;
  height:42px;
  padding:0;
  border:0;
  border-radius:50%;
  overflow:hidden;
  background:#e8f6fb;
}

.profile-btn img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.header-right{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#edf6f9;
  font-size:19px;
}

/* SEARCH */

.search{
  display:none;
  position:absolute;
  top:8px;
  left:60px;
  right:60px;
  z-index:50;
}

.search input{
  width:100%;
  height:44px;
  border:1px solid #d9e6eb;
  border-radius:13px;
  padding:0 14px;
  outline:none;
  font-size:16px;
  background:white;
}

/* MENU */

.menu{
  display:none;
  position:absolute;
  top:65px;
  z-index:40;
  background:white;
  border-radius:15px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
  overflow:hidden;
}

.profile-menu{
  left:10px;
  width:230px;
}

.settings-menu{
  right:10px;
  width:235px;
}

.menu button{
  width:100%;
  padding:14px 16px;
  border:0;
  background:white;
  text-align:left;
  font-size:14px;
}

.menu button:active{
  background:#eef7fb;
}

/* TABS */

.tabs{
  height:52px;
  display:flex;
  background:white;
  border-bottom:1px solid #dce7ec;
}

.tabs button{
  flex:1;
  border:0;
  background:white;
  color:#81909a;
  font-size:14px;
  font-weight:bold;
}

.tabs button.active{
  color:#35a8d0;
  border-bottom:3px solid #35a8d0;
}

/* MAIN */

.main{
  height:calc(100% - 112px);
}

/* CODE */

.code-view{
  height:100%;
  display:flex;
  flex-direction:column;
  background:#17232d;
}

.code-bar{
  height:48px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  color:white;
}

.run-btn{
  border:0;
  padding:9px 17px;
  border-radius:10px;
  background:#35a8d0;
  color:white;
  font-weight:bold;
}

.editor{
  flex:1;
  min-height:0;
}

textarea{
  width:100%;
  height:100%;
  display:block;
  resize:none;
  border:0;
  outline:none;
  padding:15px;

  background:#17232d;
  color:#dcecf2;

  font-family:monospace;
  font-size:15px;
  line-height:1.6;

  overflow:auto;
  -webkit-overflow-scrolling:touch;
}

/* APP */

.app-view{
  display:none;
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  overflow:auto;
  padding:15px;
  background:#dfeef3;
}

.phone{
  width:290px;
  height:590px;
  flex-shrink:0;

  background:white;
  border:7px solid #17232d;
  border-radius:35px;

  overflow:hidden;

  box-shadow:0 12px 35px rgba(0,0,0,.18);
}

.phone-top{
  height:26px;
  position:relative;
}

.camera{
  position:absolute;
  width:65px;
  height:17px;
  left:50%;
  transform:translateX(-50%);
  background:#17232d;
  border-radius:0 0 12px 12px;
}

iframe{
  width:100%;
  height:calc(100% - 26px);
  border:0;
}

/* IMAGE UPLOAD */

#imageInput{
  display:none;
}

</style>

</head>


<body>


<!-- HEADER -->

<header class="header">

  <!-- PROFILE IMAGE -->

  <button
    class="profile-btn"
    onclick="toggleProfile()">

    <img
      id="profileImage"
      src="https://via.placeholder.com/100"
      alt="Profile">

  </button>


  <div class="header-right">

    <button
      class="icon-btn"
      onclick="openSearch()">
      🔍
    </button>

    <button
      class="icon-btn"
      onclick="toggleSettings()">
      ⚙️
    </button>

  </div>

</header>


<!-- SEARCH -->

<div
  class="search"
  id="searchBox">

  <input
    type="search"
    id="searchInput"
    placeholder="Search code...">

</div>


<!-- PROFILE MENU -->

<div
  class="menu profile-menu"
  id="profileMenu">

  <button onclick="chooseProfileImage()">
    📷 Change Profile Image
  </button>

  <button>
    📧 Gmail
  </button>

  <button>
    🔒 Privacy & Security
  </button>

  <button>
    🚪 Log out
  </button>

  <button>
    🗑️ Delete Account
  </button>

</div>


<!-- SETTINGS MENU -->

<div
  class="menu settings-menu"
  id="settingsMenu">

  <button onclick="undoCode()">
    ↩️ Undo
  </button>

  <button onclick="redoCode()">
    ↪️ Redo
  </button>

  <button onclick="copyCode()">
    📋 Copy Code
  </button>

  <button onclick="saveCode()">
    💾 Save Code
  </button>

  <button onclick="loadCode()">
    📂 Open Code
  </button>

  <button onclick="chooseImage()">
    📷 Add Image
  </button>

  <button onclick="clearCode()">
    🗑️ Clear Code
  </button>

  <hr>

  <button>
    📦 Build App
  </button>

  <button>
    📤 Publish App
  </button>

</div>


<!-- IMAGE INPUT -->

<input
  type="file"
  id="imageInput"
  accept="image/*">


<!-- TABS -->

<div class="tabs">

  <button
    id="codeTab"
    class="active"
    onclick="showCode()">

    💻 Code

  </button>

  <button
    onclick="runCode()">

    ▶️ Run

  </button>

  <button
    id="appTab"
    onclick="showApp()">

    📱 App

  </button>

</div>


<!-- MAIN -->

<main class="main">


  <!-- CODE -->

  <section
    class="code-view"
    id="codeView">

    <div class="code-bar">

      <span>
        Code Editor
      </span>

      <button
        class="run-btn"
        onclick="runCode()">

        ▶ Run

      </button>

    </div>


    <div class="editor">

<textarea id="code"><!DOCTYPE html>
<html>

<head>

<meta name="viewport"
content="width=device-width,initial-scale=1">

<style>

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial;
  background:#eef7fb;
}

.card{
  width:85%;
  max-width:360px;
  padding:30px 20px;
  text-align:center;
  background:white;
  border-radius:25px;
  box-shadow:0 12px 30px rgba(0,0,0,.1);
}

h1{
  color:#17232d;
}

p{
  color:#81909a;
}

button{
  border:0;
  padding:12px 25px;
  border-radius:12px;
  background:#35a8d0;
  color:white;
}

</style>

</head>

<body>

<div class="card">

<h1>Hello 👋</h1>

<p>Build your app with CodeWrite</p>

<button>Start</button>

</div>

</body>

</html></textarea>

    </div>

  </section>


  <!-- APP -->

  <section
    class="app-view"
    id="appView">

    <div class="phone">

      <div class="phone-top">

        <div class="camera"></div>

      </div>

      <iframe id="preview"></iframe>

    </div>

  </section>


</main>


<script>

const code =
document.getElementById("code");

const preview =
document.getElementById("preview");

const codeView =
document.getElementById("codeView");

const appView =
document.getElementById("appView");

const codeTab =
document.getElementById("codeTab");

const profileMenu =
document.getElementById("profileMenu");

const settingsMenu =
document.getElementById("settingsMenu");

const searchBox =
document.getElementById("searchBox");

const imageInput =
document.getElementById("imageInput");


function runCode(){

  preview.srcdoc = code.value;

  showApp();

}


function showCode(){

  codeView.style.display="flex";

  appView.style.display="none";

  codeTab.classList.add("active");

}


function showApp(){

  preview.srcdoc = code.value;

  codeView.style.display="none";

  appView.style.display="flex";

  codeTab.classList.remove("active");

}


function toggleProfile(){

  settingsMenu.style.display="none";

  profileMenu.style.display =
  profileMenu.style.display==="block"
  ? "none"
  : "block";

}


function toggleSettings(){

  profileMenu.style.display="none";

  settingsMenu.style.display =
  settingsMenu.style.display==="block"
  ? "none"
  : "block";

}


function openSearch(){

  searchBox.style.display="block";

  document
  .getElementById("searchInput")
  .focus();

}


function copyCode(){

  navigator.clipboard.writeText(
    code.value
  );

}


function saveCode(){

  localStorage.setItem(
    "codewrite",
    code.value
  );

}


function loadCode(){

  const saved =
  localStorage.getItem("codewrite");

  if(saved){
    code.value=saved;
  }

}


function clearCode(){

  if(confirm("Clear all code?")){
    code.value="";
  }

}


function undoCode(){

  document.execCommand("undo");

}


function redoCode(){

  document.execCommand("redo");

}


function chooseProfileImage(){

  imageInput.dataset.type="profile";

  imageInput.click();

}


function chooseImage(){

  imageInput.dataset.type="image";

  imageInput.click();

}


imageInput.addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file) return;

    const reader=new FileReader();

    reader.onload=function(e){

      if(imageInput.dataset.type==="profile"){

        document
        .getElementById("profileImage")
        .src=e.target.result;

        localStorage.setItem(
          "profileImage",
          e.target.result
        );

      }

    };

    reader.readAsDataURL(file);

  }
);


window.onload=function(){

  const saved =
  localStorage.getItem("codewrite");

  if(saved){
    code.value=saved;
  }

  const profile =
  localStorage.getItem("profileImage");

  if(profile){

    document
    .getElementById("profileImage")
    .src=profile;

  }

  preview.srcdoc=code.value;

};

</script>


</body>
</html>
