<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeWrite</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#eef7fb;
}

body{
 display:flex;
 flex-direction:column;
}

/* Header */
header{
 height:58px;
 flex-shrink:0;
 background:white;
 border-bottom:1px solid #dce7ec;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 14px;
}

.brand{
 display:flex;
 align-items:center;
 gap:9px;
}

.logo{
 width:38px;
 height:38px;
 flex-shrink:0;
 border-radius:12px;
 background:#e7f7fc;
 color:#35a8d0;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:9px;
 font-weight:bold;
}

.name{
 font-size:18px;
 font-weight:bold;
 color:#17252e;
}

.search-button,
.settings-button{
 border:0;
 background:#edf5f8;
 border-radius:10px;
 width:40px;
 height:40px;
 font-size:18px;
}

/* Search */
.search-box{
 display:none;
 position:absolute;
 top:8px;
 left:10px;
 right:10px;
 height:42px;
 z-index:10;
}

.search-box input{
 width:100%;
 height:100%;
 border:1px solid #dce7ec;
 border-radius:11px;
 padding:0 42px 0 14px;
 outline:0;
 font-size:15px;
 background:white;
}

.search-close{
 position:absolute;
 right:5px;
 top:4px;
 width:34px;
 height:34px;
 border:0;
 background:transparent;
 font-size:18px;
}

/* Main */
main{
 flex:1;
 min-height:0;
 display:flex;
 flex-direction:column;
}

/* Tabs */
.tabs{
 height:48px;
 flex-shrink:0;
 display:flex;
 background:white;
 border-bottom:1px solid #dce7ec;
}

.tab{
 flex:1;
 border:0;
 background:white;
 color:#71818a;
 font-size:14px;
 font-weight:bold;
}

.tab.active{
 color:#35a8d0;
 border-bottom:3px solid #35a8d0;
}

/* Toolbar */
.toolbar{
 height:48px;
 flex-shrink:0;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 12px;
 background:#17232d;
}

.toolbar button{
 border:0;
 color:white;
 background:transparent;
 font-size:14px;
 font-weight:bold;
}

.run{
 background:#35a8d0 !important;
 border-radius:9px !important;
 padding:8px 15px;
}

.code-title{
 color:#dcecf2;
}

/* Editor */
.editor{
 flex:1;
 min-height:0;
 background:#17232d;
}

#code{
 width:100%;
 height:100%;
 resize:none;
 border:0;
 outline:0;
 padding:16px;
 background:#17232d;
 color:#dcecf2;
 font:13px/1.6 monospace;
 -webkit-overflow-scrolling:touch;
}

/* App */
.app{
 display:none;
 flex:1;
 min-height:0;
 background:#eef7fb;
 overflow:auto;
 -webkit-overflow-scrolling:touch;
}

.app iframe{
 width:100%;
 height:100%;
 border:0;
 background:white;
}

/* Settings */
.settings{
 display:none;
 position:absolute;
 top:60px;
 right:10px;
 width:210px;
 background:white;
 border:1px solid #dce7ec;
 border-radius:14px;
 box-shadow:0 10px 30px rgba(0,0,0,.12);
 overflow:hidden;
 z-index:20;
}

.settings button{
 width:100%;
 border:0;
 background:white;
 text-align:left;
 padding:13px 15px;
 font-size:14px;
}

.settings button:active{
 background:#eef7fb;
}
</style>
</head>

<body>

<header>

<div class="brand">
 <div class="logo">CW</div>
 <div class="name">CodeWrite</div>
</div>

<div>
 <button class="search-button" onclick="openSearch()">🔍</button>
 <button class="settings-button" onclick="toggleSettings()">⚙️</button>
</div>

<div class="search-box" id="searchBox">
 <input id="searchInput" type="search" placeholder="Search code...">
 <button class="search-close" onclick="closeSearch()">✕</button>
</div>

<div class="settings" id="settings">
 <button onclick="copyCode()">📋 Copy Code</button>
 <button onclick="saveCode()">💾 Save Code</button>
 <button onclick="loadCode()">📂 Open Code</button>
 <button onclick="clearCode()">🗑️ Clear Code</button>
</div>

</header>


<main>

<div class="tabs">
 <button class="tab active" id="codeTab" onclick="showCode()">💻 Code</button>
 <button class="tab" id="appTab" onclick="showApp()">📱 App</button>
</div>


<div class="toolbar">

 <button class="code-title">Code</button>

 <button class="run" onclick="runCode()">▶ Run</button>

</div>


<div class="editor" id="editor">

<textarea id="code"><!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{
 margin:0;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family:Arial;
 background:#e9f8fd;
}

.card{
 width:85%;
 padding:30px 20px;
 text-align:center;
 background:white;
 border-radius:25px;
 box-shadow:0 15px 35px rgba(0,0,0,.10);
}

.logo{
 width:75px;
 height:75px;
 margin:auto;
 border-radius:22px;
 background:#e7f7fc;
 color:#35a8d0;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:24px;
 font-weight:bold;
}

h1{
 color:#17232d;
}

p{
 color:#81909a;
}

button{
 border:0;
 padding:12px 25px;
 border-radius:12px;
 background:#35a8d0;
 color:white;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">&lt;/&gt;</div>

<h1>CodeWrite</h1>

<p>Write • Test • Create</p>

<button>Start</button>

</div>

</body>
</html></textarea>

</div>


<div class="app" id="app">
 <iframe id="preview"></iframe>
</div>

</main>


<script>

const code = document.getElementById("code");
const editor = document.getElementById("editor");
const app = document.getElementById("app");
const preview = document.getElementById("preview");
const codeTab = document.getElementById("codeTab");
const appTab = document.getElementById("appTab");
const settings = document.getElementById("settings");
const searchBox = document.getElementById("searchBox");

function runCode(){
 preview.srcdoc = code.value;
}

function showCode(){
 editor.style.display="block";
 app.style.display="none";

 codeTab.classList.add("active");
 appTab.classList.remove("active");
}

function showApp(){
 runCode();

 editor.style.display="none";
 app.style.display="block";

 codeTab.classList.remove("active");
 appTab.classList.add("active");
}

function openSearch(){
 searchBox.style.display="block";
 document.getElementById("searchInput").focus();
}

function closeSearch(){
 searchBox.style.display="none";
}

function toggleSettings(){
 settings.style.display =
 settings.style.display==="block" ? "none" : "block";
}

function copyCode(){
 navigator.clipboard.writeText(code.value);
 settings.style.display="none";
 alert("Code copied!");
}

function saveCode(){
 localStorage.setItem("codewrite",code.value);
 settings.style.display="none";
 alert("Code saved!");
}

function loadCode(){
 const saved=localStorage.getItem("codewrite");

 if(saved){
  code.value=saved;
  alert("Code opened!");
 }else{
  alert("No saved code.");
 }

 settings.style.display="none";
}

function clearCode(){
 if(confirm("Clear all code?")){
  code.value="";
 }

 settings.style.display="none";
}

window.onload=function(){
 const saved=localStorage.getItem("codewrite");

 if(saved){
  code.value=saved;
 }

 runCode();
 showCode();
};

</script>

</body>
</html>
