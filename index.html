<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeWrite</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#eef7fb;
 height:100vh;
 overoverflow:auto;
}

header{
 height:62px;
 background:white;
 border-bottom:1px solid #dce7ec;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
}

.brand{
 display:flex;
 align-items:center;
 gap:10px;
}

.logo{
 width:42px;
 height:42px;
 border-radius:14px;
 background:#e7f7fc;
 color:#35a8d0;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:20px;
 font-weight:bold;
}

.name{
 font-size:20px;
 font-weight:bold;
 color:#17252e;
}

.sub{
 font-size:10px;
 color:#82929b;
}

.top button{
 border:0;
 background:#edf5f8;
 border-radius:9px;
 padding:9px 12px;
 margin-left:4px;
 cursor:pointer;
}

.workspace{
 height:calc(100vh - 62px);
 display:flex;
}

.editor{
 width:50%;
 background:#17232d;
 color:white;
 display:flex;
 flex-direction:column;
}

.editor-head,
.preview-head{
 height:50px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 13px;
}

.editor-head{
 border-bottom:1px solid #34434d;
}

.run{
 border:0;
 background:#35a8d0;
 color:white;
 border-radius:9px;
 padding:9px 18px;
 font-weight:bold;
}

#code{
 flex:1;
 width:100%;
 resize:none;
 border:0;
 outline:0;
 padding:18px;
 background:#17232d;
 color:#dcecf2;
 font:13px/1.6 monospace;
 -webkit-overflow-scrolling:touch;
}

.preview{
 width:50%;
 display:flex;
 flex-direction:column;
 background:#eef7fb;
}

.preview-head{
 background:white;
 border-bottom:1px solid #dce7ec;
}

.preview-area{
 flex:1;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:15px;
}

.phone{
 width:300px;
 height:590px;
 background:white;
 border:7px solid #17232d;
 border-radius:35px;
 overflow:hidden;
 box-shadow:0 15px 40px #9db7c2;
}

.phone-top{
 height:25px;
 position:relative;
 background:white;
}

.camera{
 width:65px;
 height:17px;
 background:#17232d;
 border-radius:0 0 12px 12px;
 position:absolute;
 left:50%;
 transform:translateX(-50%);
}

iframe{
 width:100%;
 height:calc(100% - 25px);
 border:0;
}

@media(max-width:700px){
 .workspace{flex-direction:column}
 .editor,.preview{width:100%;height:auto}
 .phone{width:220px;height:390px}
 .sub{display:none}
}
</style>
</head>

<body>

<header>

<div class="brand">
 <div class="logo">𝕮𝖔𝖉𝖊𝖂𝖗𝖎𝖙𝖊</div>
 <div>
  <div class="name">CodeWrite</div>
  <div class="sub">Write • Test • Create</div>
 </div>
</div>

<div class="top">
 <button onclick="copyCode()">📋 Copy</button>
 <button onclick="saveCode()">💾 Save</button>
</div>

</header>


<div class="workspace">

<section class="editor">

<div class="editor-head">
 <b>💻 Code</b>
 <button class="run" onclick="runCode()">▶ Run</button>
</div>

<textarea id="code"><!DOCTYPE html>
<html>
<head>
<style>
body{
 margin:0;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family:Arial;
 background:#e9f8fd;
}

.card{
 width:80%;
 padding:30px;
 text-align:center;
 background:white;
 border-radius:25px;
 box-shadow:0 15px 35px rgba(0,0,0,.10);
}

.logo{
 width:75px;
 height:75px;
 margin:auto;
 border-radius:22px;
 background:#e7f7fc;
 color:#35a8d0;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:28px;
 font-weight:bold;
}

h1{
 color:#17232d;
}

p{
 color:#81909a;
}

button{
 border:0;
 padding:12px 25px;
 border-radius:12px;
 background:#35a8d0;
 color:white;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">&lt;/&gt;</div>

<h1>CodeWrite</h1>

<p>Write • Test • Create</p>

<button>Start</button>

</div>

</body>
</html></textarea>

</section>


<section class="preview">

<div class="preview-head">
 <b>📱 App Preview</b>
 <button onclick="runCode()">🔄 Reload</button>
</div>

<div class="preview-area">

<div class="phone">

<div class="phone-top">
<div class="camera"></div>
</div>

<iframe id="preview"></iframe>

</div>

</div>

</section>

</div>


<script>

function runCode(){
 document.getElementById("preview").srcdoc=
 document.getElementById("code").value;
}

function copyCode(){
 navigator.clipboard.writeText(
 document.getElementById("code").value
 );
 alert("Code copied!");
}

function saveCode(){
 localStorage.setItem(
 "codewrite",
 document.getElementById("code").value
 );
 alert("Code saved!");
}

window.onload=function(){

 let saved=localStorage.getItem("codewrite");

 if(saved){
  document.getElementById("code").value=saved;
 }

 runCode();
};

</script>

</body>
</html>
