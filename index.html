<title>CodeWrite</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#eef7fb;
}


/* ================================
   HEADER
================================ */

.header{
  height:60px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  border-bottom:1px solid #e1ebef;
}

.profile-btn{
  width:42px;
  height:42px;
  padding:0;
  border:0;
  border-radius:50%;
  overflow:hidden;
  background:#e8f6fb;
}

.profile-btn img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.header-right{
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#edf6f9;
  font-size:19px;
}


/* ================================
   SEARCH
================================ */

.search{
  display:none;
  position:absolute;
  top:8px;
  left:60px;
  right:115px;
  z-index:50;
}

.search input{
  width:100%;
  height:44px;
  border:1px solid #d9e6eb;
  border-radius:13px;
  padding:0 80px 0 14px;
  outline:none;
  font-size:16px;
  background:white;
}

#searchCount{
  position:absolute;
  right:10px;
  top:14px;
  font-size:12px;
  color:#81909a;
  pointer-events:none;
}


/* ================================
   MENU
================================ */

.menu{
  display:none;
  position:absolute;
  top:65px;
  z-index:40;
  background:white;
  border-radius:15px;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
  overflow:hidden;
}

.profile-menu{
  left:10px;
  width:230px;
}

.settings-menu{
  right:10px;
  width:235px;
}

.menu button{
  width:100%;
  padding:14px 16px;
  border:0;
  background:white;
  text-align:left;
  font-size:14px;
}

.menu button:active{
  background:#eef7fb;
}

.menu hr{
  border:0;
  border-top:1px solid #e5edf0;
  margin:0;
}


/* ================================
   TABS
================================ */

.tabs{
  height:52px;
  display:flex;
  background:white;
  border-bottom:1px solid #dce7ec;
}

.tabs button{
  flex:1;
  border:0;
  background:white;
  color:#81909a;
  font-size:14px;
  font-weight:bold;
}

.tabs button.active{
  color:#35a8d0;
  border-bottom:3px solid #35a8d0;
}


/* ================================
   MAIN
================================ */

.main{
  height:calc(100% - 112px);
}


/* ================================
   CODE VIEW
================================ */

.code-view{
  height:100%;
  display:flex;
  flex-direction:column;
  background:#17232d;
}

.code-bar{
  height:48px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 12px;
  color:white;
}

.run-btn{
  border:0;
  padding:9px 17px;
  border-radius:10px;
  background:#35a8d0;
  color:white;
  font-weight:bold;
}


/* ================================
   CODE EDITOR
================================ */

.editor{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  background:#17232d;
}

.editor-highlight,
.editor textarea{

  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:100%;

  margin:0;

  padding:15px;

  border:0;
  outline:none;

  font-family:
    "SFMono-Regular",
    Consolas,
    "Liberation Mono",
    Menlo,
    monospace;

  font-size:15px;
  line-height:1.6;

  tab-size:2;

  white-space:pre;

  word-wrap:normal;

  overflow:auto;

  -webkit-overflow-scrolling:touch;
}


/* ================================
   HIGHLIGHT LAYER
================================ */

.editor-highlight{

  z-index:1;

  pointer-events:none;

  color:#dcecf2;

}


/* ================================
   TEXTAREA LAYER
================================ */

.editor textarea{

  z-index:2;

  background:transparent;

  color:transparent;

  caret-color:white;

  resize:none;

  -webkit-text-fill-color:transparent;

}


/* ================================
   SYNTAX COLORS
================================ */


/* 🟢 MAIN / PARENT TAGS */

.hl-main-tag{
  color:#42e878;
  font-weight:bold;
}


/* 🔵 NORMAL TAGS */

.hl-tag{
  color:#55b9ff;
}


/* 🔵 ATTRIBUTES */

.hl-attr{
  color:#61b7ff;
}


/* 🟠 STRINGS */

.hl-string{
  color:#f5b86c;
}


/* ⚪ COMMENTS */

.hl-comment{
  color:#7f929d;
  font-style:italic;
}


/* 🟣 CSS PROPERTY */

.hl-property{
  color:#c792ea;
}


/* 🟣 JAVASCRIPT KEYWORDS */

.hl-keyword{
  color:#e58cff;
}


/* 🔵 FUNCTIONS */

.hl-function{
  color:#64d8ff;
}


/* 🟣 NUMBERS */

.hl-number{
  color:#d89cff;
}


/* ================================
   APP PREVIEW
================================ */

.app-view{
  display:none;

  width:100%;
  height:100%;

  align-items:center;
  justify-content:center;

  overflow:auto;

  padding:15px;

  background:#dfeef3;
}

.phone{
  width:290px;
  height:590px;

  flex-shrink:0;

  border:7px solid #17232d;

    0 12px 35px rgba(0,0,0,.18);
}

.phone-top{

}

.camera{
  position:absolute;

  width:65px;
  height:17px;

  left:50%;

  transform:

  background:#17232d;

  border-radius:

}

iframe{
  width:100%;
  height:calc(100% - 26px);
  border:0;
}


/* ================================
   IMAGE INPUT
================================ */

#imageInput{
  display:none;
}

</style>

<main class="main">

       CODE EDITOR

      </pre>


      <!-- CODE INPUT -->

      <textarea
        id="code"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off"><!DOCTYPE html>

<style>

<script>

/* ================================
   ELEMENTS
================================ */

const code =
document.getElementById("code");

const highlight =
document.getElementById("highlight");

const preview =
document.getElementById("preview");

const codeView =
document.getElementById("codeView");

const appView =
document.getElementById("appView");

const codeTab =
document.getElementById("codeTab");

const appTab =
document.getElementById("appTab");

const profileMenu =
document.getElementById("profileMenu");

const settingsMenu =
document.getElementById("settingsMenu");

const searchBox =
document.getElementById("searchBox");

const searchInput =
document.getElementById("searchInput");

const searchCount =
document.getElementById("searchCount");

const imageInput =
document.getElementById("imageInput");


/* ================================
   SEARCH STATE
================================ */

let searchMatches = [];

let searchPosition = -1;


/* ================================
   ESCAPE HTML
================================ */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* ================================
   SYNTAX HIGHLIGHT
================================ */

function highlightCode(){

  const source =
    code.value;

  let result = "";

  let i = 0;


  while(i < source.length){

    /*
      HTML COMMENT
    */

    if(
      source.startsWith(
        "<!--",
        i
      )
    ){

      const end =
        source.indexOf(
          "-->",
          i + 4
        );

      const finish =
        end === -1
          ? source.length
          : end + 3;

      const comment =
        source.substring(
          i,
          finish
        );

      result +=
        '<span class="hl-comment">' +
        escapeHTML(comment) +
        '</span>';

      i = finish;

      continue;

    }


    /*
      HTML TAG
    */

    if(source[i] === "<"){

      const end =
        source.indexOf(
          ">",
          i + 1
        );


      if(end !== -1){

        const tagText =
          source.substring(
            i,
            end + 1
          );


        const tagMatch =
          tagText.match(
            /^(&lt;|<)\s*(\/?)\s*([a-zA-Z0-9-]+)/
          );


        if(tagMatch){

          const closing =
            tagMatch[2];

          const tagName =
            tagMatch[3]
              .toLowerCase();


          /*
            MAIN TAGS
          */

          const isMain =
            [
              "html",
              "head",
              "body",
              "style",
              "script"
            ].includes(
              tagName
            );


          let tagClass =
            isMain
              ? "hl-main-tag"
              : "hl-tag";


          /*
            BUILD TAG
          */

          let coloredTag =
            "";


          const openPart =
            tagText.substring(
              0,
              tagText.indexOf(
                tagName
              )
            );


          coloredTag +=
            escapeHTML(
              openPart
            );


          coloredTag +=
            '<span class="' +
            tagClass +
            '">' +
            escapeHTML(
              closing +
              tagName
            ) +
            '</span>';


          let rest =
            tagText.substring(
              tagText.indexOf(
                tagName
              ) +
              tagName.length
            );


          /*
            ATTRIBUTES
          */

          rest =
            rest.replace(
              /([a-zA-Z_:][-a-zA-Z0-9_:.]*)(\s*=\s*)(["'][^"']*["'])/g,
              '<span class="hl-attr">$1</span>$2<span class="hl-string">$3</span>'
            );


          coloredTag +=
            escapeHTML(
              rest
            );


          result +=
            coloredTag;


          i =
            end + 1;

          continue;

        }

      }

    }


    /*
      STRING
    */

    if(
      source[i] === '"' ||
      source[i] === "'" ||
      source[i] === "`"
    ){

      const quote =
        source[i];

      let end =
        i + 1;


      while(
        end < source.length
      ){

        if(
          source[end] === quote &&
          source[end - 1] !== "\\"
        ){

          end++;

          break;

        }

        end++;

      }


      result +=
        '<span class="hl-string">' +
        escapeHTML(
          source.substring(
            i,
            end
          )
        ) +
        '</span>';


      i = end;

      continue;

    }


    /*
      NORMAL TEXT
    */

    let next = i + 1;


    while(
      next < source.length &&
      source[next] !== "<" &&
      source[next] !== '"' &&
      source[next] !== "'" &&
      source[next] !== "`"
    ){

      next++;

    }


    let text =
      source.substring(
        i,
        next
      );


    /*
      JAVASCRIPT KEYWORDS
    */

    text =
      escapeHTML(
        text
      );


    text =
      text.replace(
        /\b(const|let|var|function|return|if|else|for|while|new|true|false|null|undefined|class|this)\b/g,
        '<span class="hl-keyword">$1</span>'
      );


    /*
      FUNCTION NAMES
    */

    text =
      text.replace(
        /\b([a-zA-Z_$][\w$]*)(?=\()/g,
        '<span class="hl-function">$1</span>'
      );


    /*
      NUMBERS
    */

    text =
      text.replace(
        /\b(\d+(?:\.\d+)?)\b/g,
        '<span class="hl-number">$1</span>'
      );


    result +=
      text;


    i = next;

  }


  /*
    Keep last empty line
  */

  if(
    source.endsWith("\n")
  ){

    result += "\n";

  }


  highlight.innerHTML =
    result;

}


/* ================================
   EDITOR SYNC
================================ */

code.addEventListener(
  "input",
  function(){

    highlightCode();

  }
);


code.addEventListener(
  "scroll",
  function(){

    highlight.scrollTop =
      code.scrollTop;

    highlight.scrollLeft =
      code.scrollLeft;

  }
);


/* ================================
   TAB KEY
================================ */

code.addEventListener(
  "keydown",
  function(event){

    if(
      event.key !== "Tab"
    ){

      return;

    }

    event.preventDefault();


    const start =
      code.selectionStart;

    const end =
      code.selectionEnd;


    code.setRangeText(
      "  ",
      start,
      end,
      "end"
    );


    highlightCode();

  }
);


/* ================================
   RUN
================================ */

function runCode(){

  preview.srcdoc =
    code.value;

  showApp();

}


/* ================================
   SHOW CODE
================================ */

function showCode(){

  codeView.style.display =
    "flex";

  appView.style.display =
    "none";

  codeTab.classList.add(
    "active"
  );

  appTab.classList.remove(
    "active"
  );

  highlightCode();

}


/* ================================
   SHOW APP
================================ */

function showApp(){

  preview.srcdoc =
    code.value;

  codeView.style.display =
    "none";

  appView.style.display =
    "flex";

  codeTab.classList.remove(
    "active"
  );

  appTab.classList.add(
    "active"
  );

}


/* ================================
   PROFILE
================================ */

function toggleProfile(){

  settingsMenu.style.display =
    "none";

  profileMenu.style.display =
    profileMenu.style.display ===
    "block"
      ? "none"
      : "block";

}


/* ================================
   SETTINGS
================================ */

function toggleSettings(){

  profileMenu.style.display =
    "none";

  settingsMenu.style.display =
    settingsMenu.style.display ===
    "block"
      ? "none"
      : "block";

}


/* ================================
   SEARCH
================================ */

function openSearch(){

  searchBox.style.display =
    "block";

  searchInput.focus();

}


searchInput.addEventListener(
  "keydown",
  function(event){

    if(
      event.key !== "Enter"
    ){

      return;

    }

    event.preventDefault();

    performSearch();

  }
);


function performSearch(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();


  searchMatches = [];

  searchPosition = -1;


  if(!query){

    searchCount.textContent =
      "";

    return;

  }


  const text =
    code.value.toLowerCase();


  let start = 0;


  while(true){

    const found =
      text.indexOf(
        query,
        start
      );


    if(
      found === -1
    ){

      break;

    }


    searchMatches.push(
      found
    );


    start =
      found +
      query.length;

  }


  if(
    searchMatches.length === 0
  ){

    searchCount.textContent =
      "0 results";

    return;

  }


  searchPosition = 0;

  goToSearchResult();

}


function goToSearchResult(){

  if(
    searchPosition < 0 ||
    searchPosition >=
      searchMatches.length
  ){

    return;

  }


  const start =
    searchMatches[
      searchPosition
    ];


  const end =
    start +
    searchInput.value.length;


  code.focus();


  code.setSelectionRange(
    start,
    end
  );


  const textBefore =
    code.value.substring(
      0,
      start
    );


  const lineNumber =
    textBefore.split(
      "\n"
    ).length;


  const lineHeight =
    parseFloat(
      getComputedStyle(
        code
      ).lineHeight
    );


  code.scrollTop =
    Math.max(
      0,
      (lineNumber - 4) *
      lineHeight
    );


  searchCount.textContent =
    (searchPosition + 1) +
    " / " +
    searchMatches.length;

}


function searchNext(){

  if(
    !searchMatches.length
  ){

    return;

  }


  searchPosition++;


  if(
    searchPosition >=
    searchMatches.length
  ){

    searchPosition = 0;

  }


  goToSearchResult();

}


function searchPrevious(){

  if(
    !searchMatches.length
  ){

    return;

  }


  searchPosition--;


  if(
    searchPosition < 0
  ){

    searchPosition =
      searchMatches.length - 1;

  }


  goToSearchResult();

}


/* ================================
   COPY
================================ */

function copyCode(){

  navigator.clipboard
    .writeText(
      code.value
    )
    .then(
      function(){

        alert(
          "បានចម្លងកូដហើយ ✓"
        );

      }
    )
    .catch(
      function(){

        alert(
          "មិនអាចចម្លងកូដបានទេ"
        );

      }
    );

}


/* ================================
   SAVE
================================ */

function saveCode(){

  localStorage.setItem(
    "codewrite",
    code.value
  );


  alert(
    "បានរក្សាទុកកូដហើយ ✓"
  );

}


/* ================================
   LOAD
================================ */

function loadCode(){

  const saved =
    localStorage.getItem(
      "codewrite"
    );


  if(saved){

    code.value =
      saved;

    highlightCode();


    alert(
      "បានបើកកូដហើយ ✓"
    );

  }else{

    alert(
      "មិនមានកូដដែលបានរក្សាទុកទេ"
    );

  }

}


/* ================================
   GMAIL
================================ */

function openGmail(){

  window.open(
    "https://mail.google.com/",
    "_blank"
  );

}


/* ================================
   PRIVACY
================================ */

function openPrivacy(){

  alert(
    "🔒 Privacy & Security\n\n" +
    "Privacy\n" +
    "• Your code is stored locally on this device.\n" +
    "• Your profile image is stored locally.\n\n" +
    "Security\n" +
    "• CodeWrite does not send your code anywhere."
  );

}


/* ================================
   LOGOUT
================================ */

function logout(){

  profileMenu.style.display =
    "none";

  settingsMenu.style.display =
    "none";


  alert(
    "បាន Log out ហើយ ✓"
  );

}


/* ================================
   DELETE ACCOUNT
================================ */

function deleteAccount(){

  const confirmed =
    confirm(
      "⚠️ តើអ្នកប្រាកដថាចង់ Delete Account មែនទេ?"
    );


  if(!confirmed){

    return;

  }


  localStorage.clear();


  profileMenu.style.display =
    "none";

  settingsMenu.style.display =
    "none";


  alert(
    "Account ត្រូវបានលុបហើយ ✓"
  );


  location.reload();

}


/* ================================
   BUILD APP
================================ */

function buildApp(){

  const appCode =
    code.value.trim();


  if(!appCode){

    alert(
      "មិនមានកូដសម្រាប់ Build App ទេ"
    );

    return;

  }


  localStorage.setItem(
    "builtApp",
    appCode
  );


  preview.srcdoc =
    appCode;


  showApp();


  alert(
    "📦 Build App បានជោគជ័យ ✓\n\n" +
    "App ត្រូវបានរក្សាទុករួចហើយ។"
  );

}


/* ================================
   PUBLISH APP
================================ */

function publishApp(){

  const appCode =
    code.value.trim();


  if(!appCode){

    alert(
      "មិនមានកូដសម្រាប់ Publish App ទេ"
    );

    return;

  }


  localStorage.setItem(
    "publishedApp",
    appCode
  );


  preview.srcdoc =
    appCode;


  showApp();


  alert(
    "📤 App បាន Publish ជោគជ័យ ✓\n\n" +
    "App របស់អ្នកត្រូវបានរក្សាទុក និងបង្ហាញក្នុង Preview ហើយ។"
  );

}


/* ================================
   CLEAR
================================ */

function clearCode(){

  if(
    confirm(
      "Clear all code?"
    )
  ){

    code.value =
      "";

    highlightCode();

  }

}


/* ================================
   UNDO
================================ */

function undoCode(){

  code.focus();

  document.execCommand(
    "undo"
  );

  highlightCode();

}


/* ================================
   REDO
================================ */

function redoCode(){

  code.focus();

  document.execCommand(
    "redo"
  );

  highlightCode();

}


/* ================================
   PROFILE IMAGE
================================ */

function chooseProfileImage(){

  imageInput.dataset.type =
    "profile";

  imageInput.click();

}


/* ================================
   ADD IMAGE
================================ */

function chooseImage(){

  imageInput.dataset.type =
    "image";

  imageInput.click();

}


/* ================================
   IMAGE
================================ */

imageInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];


    if(!file){

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(e){

        if(
          imageInput.dataset.type ===
          "profile"
        ){

          document
            .getElementById(
              "profileImage"
            )
            .src =
            e.target.result;


          localStorage.setItem(
            "profileImage",
            e.target.result
          );


          return;

        }


        if(
          imageInput.dataset.type ===
          "image"
        ){

          const imageCode =
            '<img src="' +
            e.target.result +
            '" style="max-width:100%;height:auto;">';


          const position =
            code.selectionStart;


          code.value =
            code.value.substring(
              0,
              position
            ) +
            "\n" +
            imageCode +
            "\n" +
            code.value.substring(
              position
            );


          code.focus();


          highlightCode();


          alert(
            "បានបញ្ចូលរូបភាពទៅក្នុងកូដហើយ ✓"
          );

        }

      };


    reader.readAsDataURL(
      file
    );

  }
);


/* ================================
   CLOSE MENUS
================================ */

document.addEventListener(
  "click",
  function(event){

    const insideProfile =
      event.target.closest(
        ".profile-btn,.profile-menu"
      );


    const insideSettings =
      event.target.closest(
        ".icon-btn,.settings-menu"
      );


    if(!insideProfile){

      profileMenu.style.display =
        "none";

    }


    if(
      !insideSettings &&
      !event.target.closest(
        ".search"
      )
    ){

      settingsMenu.style.display =
        "none";

    }

  }
);


/* ================================
   STARTUP
================================ */

window.onload =
  function(){

    const saved =
      localStorage.getItem(
        "codewrite"
      );


    if(saved){

      code.value =
        saved;

    }


    const profile =
      localStorage.getItem(
        "profileImage"
      );


    if(profile){

      document
        .getElementById(
          "profileImage"
        )
        .src =
        profile;

    }


    const builtApp =
      localStorage.getItem(
        "builtApp"
      );


    if(builtApp){

      preview.srcdoc =
        builtApp;

    }else{

      preview.srcdoc =
        code.value;

    }


    highlightCode();

  };

</script>
